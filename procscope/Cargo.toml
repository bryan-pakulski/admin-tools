[package]
name = "procscope"
version = "0.1.0"
edition = "2021"
description = "Non-invasive per-thread Linux process monitor with TUI timeline"
license = "MIT"

[[bin]]
name = "procscope"
path = "src/main.rs"

[[example]]
name = "stuck-recv"
path = "examples/stuck-recv.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
clap = { version = "4", features = ["derive"] }
arc-swap = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
indexmap = "2"
hdrhistogram = "7"
regex = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
