[package]
name = "gdbscope"
version = "0.1.0"
edition = "2021"
description = "Developer-friendly GDB TUI wrapper using GDB/MI protocol"
license = "MIT"

[[bin]]
name = "gdbscope"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util", "fs"] }
clap = { version = "4", features = ["derive"] }
arc-swap = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-onig"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
